name: Gerar APK (EDPLAY)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/edplay.apk"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: edplay-apk
          path: edplay.apk
          retention-days: 7
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-run-${{ github.run_id }}"
          gh release create "$TAG" "edplay.apk" --repo "${{ github.repository }}" --title "EDPLAY APK (run ${{ github.run_id }})" --notes "APK gerado automaticamente pelo workflow."
