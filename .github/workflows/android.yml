name: Gerar AAB (EDPLAY)
on: workflow_dispatch
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx --yes eas-cli@latest build --platform android --profile production --local --non-interactive --output "$GITHUB_WORKSPACE/edplay.aab"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: edplay-aab
          path: edplay.aab
          retention-days: 7
